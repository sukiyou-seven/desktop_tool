<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            text-align: center;
            color: white;
            z-index: 10;
            padding: 40px 20px;
            max-width: 800px;
        }

        .error-code {
            font-size: 180px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            animation: float 3s ease-in-out infinite;
            background: linear-gradient(to right, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .error-title {
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .error-message {
            font-size: 18px;
            margin-bottom: 40px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .home-button {
            display: inline-block;
            padding: 15px 40px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .home-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .astronaut {
            position: fixed;
            right: 10%;
            top: 20%;
            font-size: 100px;
            animation: rotate 20s linear infinite;
            opacity: 0.3;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .planet {
            position: fixed;
            left: 5%;
            bottom: 10%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, #a78bfa, #7c3aed);
            border-radius: 50%;
            opacity: 0.2;
            box-shadow: 0 0 60px rgba(167, 139, 250, 0.5);
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 120px;
            }

            .error-title {
                font-size: 24px;
            }

            .error-message {
                font-size: 16px;
            }

            .astronaut {
                font-size: 60px;
                right: 5%;
                top: 10%;
            }

            .planet {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="astronaut">👨‍🚀</div>
    <div class="planet"></div>

    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">哎呀！页面迷路了</h1>
        <p class="error-message">
            抱歉，您访问的页面似乎已经离开了这个宇宙。<br>
            它可能被黑洞吞噬，或者去了另一个维度旅行。
        </p>
<!--        <a href="/static" class="home-button">🏠 返回首页</a>-->
    </div>

    <script>
        // 生成星星
        const starsContainer = document.getElementById('stars');
        const starCount = 100;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.opacity = Math.random();
            starsContainer.appendChild(star);
        }

        // 鼠标移动视差效果
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            const astronaut = document.querySelector('.astronaut');
            const planet = document.querySelector('.planet');

            astronaut.style.transform = `translate(${mouseX * 30}px, ${mouseY * 30}px) rotate(${Date.now() / 100}deg)`;
            planet.style.transform = `translate(${-mouseX * 20}px, ${-mouseY * 20}px)`;
        });
    </script>
</body>
</html>
