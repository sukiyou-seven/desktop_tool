<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>502 - 网关错误</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .circuit-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image:
                radial-gradient(circle at 20% 50%, white 2px, transparent 2px),
                radial-gradient(circle at 80% 30%, white 2px, transparent 2px),
                radial-gradient(circle at 40% 70%, white 2px, transparent 2px),
                radial-gradient(circle at 60% 20%, white 2px, transparent 2px),
                linear-gradient(90deg, transparent 49%, rgba(255,255,255,0.3) 49%, rgba(255,255,255,0.3) 51%, transparent 51%),
                linear-gradient(0deg, transparent 49%, rgba(255,255,255,0.3) 49%, rgba(255,255,255,0.3) 51%, transparent 51%);
            background-size: 100px 100px, 100px 100px, 100px 100px, 100px 100px, 50px 50px, 50px 50px;
            animation: circuitFlow 15s linear infinite;
        }

        @keyframes circuitFlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            text-align: center;
            color: white;
            z-index: 10;
            padding: 40px 20px;
            max-width: 800px;
        }

        .server-icon {
            font-size: 100px;
            margin-bottom: 20px;
            animation: serverBlink 2s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        @keyframes serverBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.95); }
        }

        .error-code {
            font-size: 150px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            background: linear-gradient(to right, #fff, #e0f7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .error-title {
            font-size: 36px;
            margin-bottom: 20px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .error-message {
            font-size: 18px;
            margin-bottom: 40px;
            opacity: 0.95;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            background: white;
            color: #4facfe;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid transparent;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            background: transparent;
            color: white;
            border-color: white;
        }

        .btn-retry {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-retry:hover {
            background: transparent;
            border-color: white;
        }

        .wifi-icon {
            position: fixed;
            right: 10%;
            top: 15%;
            font-size: 120px;
            opacity: 0.15;
            animation: wifiPulse 3s ease-in-out infinite;
        }

        @keyframes wifiPulse {
            0%, 100% { transform: scale(1); opacity: 0.15; }
            50% { transform: scale(1.2); opacity: 0.25; }
        }

        .plug-icon {
            position: fixed;
            left: 8%;
            bottom: 12%;
            font-size: 100px;
            opacity: 0.1;
            animation: plugRotate 10s linear infinite;
        }

        @keyframes plugRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-dots {
            display: inline-flex;
            gap: 8px;
            margin-top: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            animation: dotBounce 1.4s ease-in-out infinite both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 100px;
            }

            .error-title {
                font-size: 28px;
            }

            .error-message {
                font-size: 16px;
                padding: 15px;
            }

            .server-icon {
                font-size: 80px;
            }

            .wifi-icon {
                font-size: 80px;
            }

            .plug-icon {
                font-size: 70px;
            }

            .button-group {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="circuit-bg"></div>

    <div class="wifi-icon">📡</div>
    <div class="plug-icon">🔌</div>

    <div class="container">
        <div class="server-icon">🖥️</div>
        <div class="error-code">502</div>
        <h1 class="error-title">服务器开小差了</h1>
        <div class="error-message">
            糟糕！上游服务器暂时无法响应。<br>
            可能是服务器过载或正在维护中。
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <div class="button-group">
            <button onclick="location.reload()" class="btn btn-retry">🔄 重试</button>
            <a href="/" class="btn">🏠 返回首页</a>
        </div>
    </div>

    <script>
        // 鼠标跟随效果
        document.addEventListener('mousemove', (e) => {
            const wifi = document.querySelector('.wifi-icon');
            const plug = document.querySelector('.plug-icon');

            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            wifi.style.transform = `translate(${x * 25}px, ${y * 25}px)`;
            plug.style.transform = `translate(${-x * 20}px, ${-y * 20}px) rotate(${Date.now() / 100}deg)`;
        });

        // 自动重试计数（可选）
        let retryCount = 0;
        const maxRetries = 3;

        function autoRetry() {
            if (retryCount < maxRetries) {
                retryCount++;
                setTimeout(() => {
                    location.reload();
                }, 5000); // 5秒后自动重试
            }
        }

        // 如果需要自动重试，取消下面的注释
        // autoRetry();
    </script>
</body>
</html>
