bash = "deny"

allow_write = ["${HOME}/OneDrive/桌面/doubaoWorks/HMZP/application/client_user", "${HOME}/OneDrive/桌面/doubaoWorks/HMZP/route/client", "${HOME}/OneDrive/桌面/doubaoWorks/HMZP/application/family", "${HOME}/OneDrive/桌面/doubaoWorks/HMZP/route/family"]
